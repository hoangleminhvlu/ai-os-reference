# Đề xuất sửa cấu hình nginx của iThunder AI Gateway, ngày 04/11/2026.
# Chưa kiểm chứng trên hệ thống thật: chạy "nginx -t" và thử trên một server block trước khi áp dụng.
#
# Luồng hiện tại:  máy trạm -> nginx ngoài (nginx.conf, HTTPS) -> nginx trong <IP_AI_GATEWAY>:80 (aigate) -> AI Platform <IP_AI_GATEWAY>:8088

# ============================================================================
# 1. BẮT BUỘC, nginx ngoài, server aiwork.is-tech.vn, location /api/
#    Hiện chưa gửi X-Forwarded-For: AI Platform không biết IP máy trạm khi đăng nhập qua /api/auth/login.
# ============================================================================
location /api/ {
    # Giữ các dòng add_header và khối if OPTIONS hiện có, bổ sung PATCH và X-Identity-Step-Up (mục 3), rồi thêm:
    proxy_pass http://<IP_AI_GATEWAY>;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 600s;      # đủ cho câu trả lời AI dài (SSE); WebSocket đi qua location khác
    proxy_send_timeout 600s;
}

# ============================================================================
# 2. BẮT BUỘC, .env của AI Platform (khai báo cả hai lớp nginx)
# ============================================================================
# TRUSTED_PROXIES=<IP_AI_GATEWAY>,<IP nginx ngoài nhìn từ <IP_AI_GATEWAY>>
#
# Kiểm tra: nhập sai PassCode một lần, dòng "[Login Fail]" trong ai-platform.log phải ghi đúng IP máy trạm.
# Nếu có dòng "[CẢNH BÁO][Login Guard]" thì giới hạn dò PassCode đang chưa có tác dụng.

# ============================================================================
# 3. NÊN, mọi server block: CORS thiếu PATCH và header step-up mà Workspace đang dùng
# ============================================================================
#   Access-Control-Allow-Methods: GET, POST, OPTIONS, PUT, PATCH, DELETE
#   Access-Control-Allow-Headers: ..., Authorization, Content-Type, X-Identity-Step-Up
#
# Block aigate.is-tech.vn đang trả Access-Control-Allow-Origin là chính aigate. Workspace ở aiwork.is-tech.vn gọi
# aigate.is-tech.vn là gọi khác nguồn. AI Platform cũng tự trả header CORS; khi cả nginx và FastAPI cùng trả, trình duyệt có
# thể từ chối. Nên để một nơi xử lý CORS (đề xuất: FastAPI, bỏ add_header CORS ở nginx) sau khi thử trên trình duyệt.

# ============================================================================
# 4. NÊN, nginx trong (aigate), location /api/
# ============================================================================
#   proxy_set_header Connection "";     # thay cho "Upgrade": /api/ không phải WebSocket
#   proxy_connect_timeout 10s;          # thay cho 86400s
#   proxy_read_timeout 600s;            # thay cho 86400s, giữ 86400s cho /ws/
#   client_max_body_size 60M;           # thay cho 500M: AI Platform chỉ nhận tối đa 50 MB mỗi tệp

# ============================================================================
# 5. NÊN, an toàn đường truyền và truy cập trực tiếp
# ============================================================================
# - Chặn cổng 8088, chỉ cho nginx trong kết nối (ví dụ ufw, thay đúng IP và chạy thử trước):
#     sudo ufw allow from <IP_AI_GATEWAY> to any port 8088 proto tcp
#     sudo ufw deny 8088/tcp
# - nginx ngoài -> nginx trong đang là HTTP thuần: JWT và PassCode đi dạng rõ trong mạng nội bộ.
#   Dùng TLS cho chặng này, hoặc bảo đảm đây là mạng riêng biệt.
# - Server cổng 80 của nginx trong không nên truy cập được từ Internet.
# - location /ithunder/ phục vụ /export/iThunder/ không cần đăng nhập: rà soát thư mục này không chứa dữ liệu riêng tư.
# - Thêm cho server có location riêng (add_header trong location làm mất HSTS đặt ở server):
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#     add_header X-Content-Type-Options nosniff always;
#     add_header Referrer-Policy strict-origin-when-cross-origin always;
